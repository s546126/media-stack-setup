  <rect x="1003" y="334" width="191" height="40" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="1098" y="359" font-size="12.5" font-weight="700" fill="#115e59" text-anchor="middle">Jellyfin (+ts)</text>
