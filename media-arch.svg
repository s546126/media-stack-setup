  <!-- ===== S1 entry ===== -->
  <rect x="52" y="270" width="176" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="140" y="291" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Jellyseerr :5055</text>
  <text x="140" y="309" font-size="10.5" fill="#6d28d9" text-anchor="middle">求片 · 家人自助</text>
  <rect x="52" y="338" width="176" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="140" y="359" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Prowlarr :9696</text>
  <text x="140" y="377" font-size="10.5" fill="#6d28d9" text-anchor="middle">索引器聚合</text>

  <!-- ===== S2 arr core ===== -->
  <rect x="286" y="268" width="191" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="381" y="294" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Sonarr :8989 · 剧</text>
  <rect x="286" y="314" width="191" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="381" y="340" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Radarr :7878 · 影</text>
  <rect x="286" y="360" width="191" height="40" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="381" y="385" font-size="11.5" fill="#6d28d9" text-anchor="middle">Bazarr :6767 · 中文字幕</text>

