  <line x1="300" y1="358" x2="300" y2="312" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arB)" stroke-dasharray="3 3"/>

  <!-- ===== INFRA BAND ===== -->
  <rect x="40" y="460" width="1148" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="484" font-size="13" font-weight="700" fill="#334155">宿主机层（非容器，直接装在 OS 上）</text>

  <rect x="56" y="500" width="220" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="166" y="523" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">docker + containerd</text>
  <text x="166" y="540" font-size="10" fill="#64748b" text-anchor="middle">/var/lib/containerd → /mnt/data</text>

  <rect x="292" y="500" width="300" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="442" y="523" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">host Tailscale（私网）</text>
  <text x="442" y="540" font-size="10" fill="#64748b" text-anchor="middle">各服务独立 tailscale 节点 · https 直达</text>

  <rect x="608" y="500" width="200" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="708" y="523" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">FUSE 挂载点</text>
  <text x="708" y="540" font-size="10" fill="#64748b" text-anchor="middle">/mnt/zurg · /mnt/alist</text>

  <rect x="824" y="500" width="172" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="910" y="523" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">cron 04:30</text>
  <text x="910" y="540" font-size="10" fill="#64748b" text-anchor="middle">配置备份</text>

  <rect x="1012" y="500" width="160" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1092" y="532" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">☁ Google Drive</text>

  <line x1="996" y1="528" x2="1010" y2="528" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="56" y="592" font-size="11" fill="#64748b">单机 = 单点；boot 200G；影片在 Real-Debrid / 云盘，不落本地盘；docker 容器 restart=unless-stopped 开机自启。</text>
  <text x="56" y="614" font-size="11" fill="#64748b">媒体栈 8 容器（zurg/rclone/alist/plex/jellyfin…）+ arr 栈 6 容器，跨栈走宿主机 /mnt 路径 + tailscale 黏合。</text>
  <text x="56" y="636" font-size="11" fill="#64748b">访问：每个服务都有独立 tailscale 节点，内网 https://&lt;服务名&gt;.&lt;你的tailnet&gt;.ts.net 直达，无公网暴露。</text>

