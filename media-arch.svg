  <text x="603" y="334" font-size="11" fill="#be185d" text-anchor="middle">:8282 qbit</text>
  <text x="603" y="350" font-size="10.5" fill="#be185d" text-anchor="middle">加种 → RD</text>
  <text x="603" y="365" font-size="10.5" fill="#be185d" text-anchor="middle">出符号链接</text>

  <!-- ===== S4 mount + organize ===== -->
  <rect x="729" y="267" width="216" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="837" y="292" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">zurg :9999 · RD WebDAV</text>
  <rect x="729" y="311" width="216" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="837" y="336" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">rclone → /mnt/zurg (FUSE)</text>
