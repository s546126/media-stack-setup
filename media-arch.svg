<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="700" viewBox="0 0 1480 700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#475569"/></marker>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#d97706"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#e11d48"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1480" height="700" fill="#ffffff"/>

  <text x="40" y="40" font-size="25" font-weight="700" fill="#0f172a">影音库自动化架构</text>
  <text x="40" y="62" font-size="12.5" fill="#64748b">Oracle ARM · Always Free · 单机 · 全 Docker · Tailscale 私网 · 配置每日 04:30 备份 → Google Drive</text>

  <rect x="40" y="78" width="1400" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="54" y="98" font-size="12.5" fill="#334155">流程：<tspan font-weight="700">①</tspan> 求片/索引 → <tspan font-weight="700">②</tspan> Sonarr/Radarr 决定抓什么 → <tspan font-weight="700">③</tspan> Decypharr 加种到 Real-Debrid → <tspan font-weight="700">④</tspan> zurg 串流挂载 + 符号链接进库 → <tspan font-weight="700">⑤</tspan> Plex 或 Jellyfin 播放（中文海报+字幕）</text>

  <!-- ===== TOP CLOUD SOURCES ===== -->
  <rect x="700" y="128" width="260" height="50" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="830" y="150" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">☁ Real-Debrid</text>
  <text x="830" y="168" font-size="11" fill="#a16207" text-anchor="middle">影片源 · 串流不占盘</text>

  <rect x="991" y="56" width="215" height="46" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1098" y="84" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">☁ 百度 / 夸克 / 阿里云盘</text>

  <rect x="991" y="150" width="215" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1098" y="170" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">alist :5244 + rclone-alist</text>
  <text x="1098" y="186" font-size="10.5" fill="#64748b" text-anchor="middle">→ /mnt/alist (FUSE)</text>

  <!-- ===== STAGE HEADERS ===== -->
  <text x="139"  y="246" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">① 入口</text>
  <text x="381"  y="246" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">② 自动抓取 (arr)</text>
  <text x="603"  y="246" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">③ Debrid 桥</text>
  <text x="837"  y="246" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">④ 挂载 + 整理</text>
  <text x="1098" y="246" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">⑤ 播放</text>
  <text x="1340" y="246" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">📺 观看端</text>

