name: Images
# Builds the danmu-bridge and patched LibreTV images for linux/amd64 and
# linux/arm64 and smoke-tests each one. Build only: nothing is pushed.
# Each arch builds on its own native runner (no QEMU), so the LibreTV
# Next.js build runs at full speed on arm64 too.
on:
  push:
    branches: [main]
    paths:
      - 'danmu-bridge/**'
      - 'libretv/**'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'danmu-bridge/**'
      - 'libretv/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  danmu-bridge-go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danmu-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  build:
    strategy:
      fail-fast: false
      matrix:
        image: [danmu-bridge, libretv]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Check image arch
        run: |
          got=$(docker image inspect -f '{{.Architecture}}' ${{ matrix.image }}:ci)
          echo "image arch: $got"
          test "$got" = "${{ matrix.arch }}"

      - name: Smoke test danmu-bridge
        if: matrix.image == 'danmu-bridge'
        run: |
          out=$(docker run --rm danmu-bridge:ci version)
          echo "version: $out"
          test "$out" = "${{ github.sha }}"

      - name: Smoke test LibreTV
        if: matrix.image == 'libretv'
        run: |
          docker run -d --name libretv -p 8080:8080 libretv:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs libretv
          test "$code" = 200
          # the danmaku route from the patch must exist (it answers JSON, not a 404 page)
          curl -s http://127.0.0.1:8080/api/danmaku | tee /dev/stderr | grep -q '"error"'
          docker rm -f libretv

      - name: LibreTV unit tests and typecheck
        if: matrix.image == 'libretv' && matrix.arch == 'amd64'
        uses: docker/build-push-action@v6
        with:
          context: libretv
          target: builder
          push: false
          load: true
          tags: libretv-builder:ci
          cache-from: type=gha,scope=libretv-amd64
      - if: matrix.image == 'libretv' && matrix.arch == 'amd64'
        run: docker run --rm libretv-builder:ci sh -c 'npm test && npx tsc --noEmit'
