name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/config-backup.sh && shellcheck scripts/config-backup.sh
      - run: docker compose -p media -f references/compose-media.yml --profile plex --profile jellyfin --profile alist config --quiet
      - run: docker compose -p arr -f references/compose-arr.yml config --quiet
