# ============================================================================
# ARR AUTOMATION STACK — Prowlarr / Sonarr / Radarr / Bazarr / Jellyseerr / Decypharr
# Deployed as /mnt/data/media/docker-compose.arr.yml, project `-p arr`: a SEPARATE
# project, so it never touches the media stack.
# Setup: docs/1-deploy.md, then docs/2-wire.md
#
# KEY POINTS:
#   - Ports bind to ${BIND_IP:-127.0.0.1}. Set BIND_IP in .env to the host's Tailscale
#     IPv4 (`tailscale ip -4`) for tailnet access: reachable over the tailnet, NOT the
#     public internet. Per-service https names are optional: docs/tailscale.md.
#   - All six containers share the default `arr_default` network and reach each other
#     by container name (sonarr:8989, decypharr:8282, ...).
#   - Decypharr (cy01/blackhole) is the debrid bridge: it speaks the qBittorrent API
#     to Sonarr/Radarr, adds releases to Real-Debrid, and symlinks the cached files
#     from the rclone/zurg mount into download_folder. It MUST see /mnt at /mnt so
#     its symlinks (pointing at /mnt/zurg/...) are valid everywhere.
# ============================================================================

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment: [ PUID=1000, PGID=1000, TZ=UTC ]
    volumes: [ "./prowlarr-config:/config" ]
    ports: [ "${BIND_IP:-127.0.0.1}:9696:9696" ]

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment: [ PUID=1000, PGID=1000, TZ=UTC ]
    volumes:
      - ./sonarr-config:/config
      - /mnt:/mnt:rslave            # see RD library + symlink library at native paths
    ports: [ "${BIND_IP:-127.0.0.1}:8989:8989" ]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment: [ PUID=1000, PGID=1000, TZ=UTC ]
    volumes:
      - ./radarr-config:/config
      - /mnt:/mnt:rslave
    ports: [ "${BIND_IP:-127.0.0.1}:7878:7878" ]

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment: [ PUID=1000, PGID=1000, TZ=UTC ]
    volumes:
      - ./bazarr-config:/config
      - /mnt:/mnt:rslave
    ports: [ "${BIND_IP:-127.0.0.1}:6767:6767" ]

  jellyseerr:
    networks: [ default, playback ]
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    environment: [ LOG_LEVEL=info, TZ=UTC, PUID=1000, PGID=1000 ]
    volumes: [ "./jellyseerr-config:/app/config" ]
    ports: [ "${BIND_IP:-127.0.0.1}:5055:5055" ]

  decypharr:
    image: cy01/blackhole:latest        # aka ghcr.io/sirrobot01/decypharr
    container_name: decypharr
    restart: unless-stopped
    environment: [ PUID=1000, PGID=1000, TZ=UTC ]
    volumes:
      - ./decypharr-config:/app         # holds config.json (debrids, download_folder)
      - /mnt:/mnt:rslave                # reads /mnt/zurg, writes symlinks to library
    ports: [ "${BIND_IP:-127.0.0.1}:8282:8282" ]

networks:
  playback:
    external: true
    name: media-playback
