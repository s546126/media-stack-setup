# ============================================================================
# MEDIA STACK — zurg + rclone (+ alist) + Plex/Jellyfin
# Deployed as /mnt/data/media/docker-compose.yml, project `-p media`.
# Setup: docs/1-deploy.md
#
# KEY POINTS:
#   - rclone needs cap_add SYS_ADMIN + /dev/fuse + apparmor:unconfined to FUSE-mount.
#   - The mount uses :rshared so the FUSE submount propagates to other containers.
#   - Plex/Jellyfin mount BOTH the app paths AND /mnt:/mnt:rslave — the latter is
#     REQUIRED so the arr stack's symlinks (which point at /mnt/zurg/...) resolve.
#   - PUID/PGID=1000 should match the owner of the ./ config dirs.
#   - Enable --profile plex and/or --profile jellyfin (they do the same job; run one
#     or both); alist is opt-in. TS_AUTHKEY in .env is needed only for Tailscale-backed
#     profiles (docs/tailscale.md).
# ============================================================================

services:
  zurg:
    image: ghcr.io/debridmediamanager/zurg-testing:latest
    container_name: zurg
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:9999"          # localhost only; do NOT expose 0.0.0.0 publicly
    volumes:
      - ./zurg/config.yml:/app/config.yml
      - zurgdata:/app/data

  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    environment: { TZ: UTC }
    volumes:
      - /mnt/zurg:/data:rshared
      - ./zurg/rclone.conf:/config/rclone/rclone.conf
      - /mnt/data/cache:/cache
    cap_add: [ SYS_ADMIN ]
    security_opt: [ "apparmor:unconfined" ]
    devices: [ "/dev/fuse:/dev/fuse:rwm" ]
    depends_on: [ zurg ]
    command: >-
      mount zurg: /data --allow-other --uid 1000 --gid 1000 --umask 002 --dir-cache-time 10s
      --vfs-cache-mode full --cache-dir /cache --vfs-cache-max-size 20G --buffer-size 64M

  # ---- optional: alist for 百度/夸克/阿里云盘, behind its own tailscale sidecar ----
  alist:
    profiles: [ alist ]
    image: xhofe/alist:latest
    container_name: alist
    restart: unless-stopped
    environment: [ PUID=1000, PGID=1000, UMASK=022, TZ=UTC ]
    volumes: [ "./alist:/opt/alist/data" ]
    network_mode: "service:alist-ts"
    depends_on: [ alist-ts ]
  alist-ts:
    profiles: [ alist ]
    image: tailscale/tailscale:latest
    container_name: alist-ts
    restart: unless-stopped
    hostname: alist
    environment:
      - TS_HOSTNAME=alist
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json     # 443 -> 127.0.0.1:5244 (docs/tailscale.md)
    volumes:
      - tailscale-alist:/var/lib/tailscale
      - ./alist-ts:/config
  rclone-alist:
    profiles: [ alist ]
    image: rclone/rclone:latest
    container_name: rclone-alist
    restart: unless-stopped
    environment: { TZ: UTC }
    volumes:
      - /mnt/alist:/data:rshared
      - ./zurg/rclone.conf:/config/rclone/rclone.conf
      - /mnt/data/cache-alist:/cache
    cap_add: [ SYS_ADMIN ]
    security_opt: [ "apparmor:unconfined" ]
    devices: [ "/dev/fuse:/dev/fuse:rwm" ]
    depends_on: [ alist ]
    command: >-
      mount alist: /data --allow-other --uid 1000 --gid 1000 --umask 002 --dir-cache-time 30s
      --vfs-cache-mode full --cache-dir /cache --vfs-cache-max-size 10G --buffer-size 32M

  plex:
    networks: [ default, playback ]
    profiles: [ plex ]
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    ports: [ "${BIND_IP:-127.0.0.1}:32400:32400" ]
    environment: [ PUID=1000, PGID=1000, TZ=UTC, VERSION=docker ]
    volumes:
      - ./plex-config:/config
      - ./plex-transcode:/transcode
      - /mnt:/mnt:rslave                # REQUIRED: symlinks point at /mnt/zurg/...
    depends_on: [ rclone ]

  jellyfin-ts:
    networks:
      default: {}
      playback:
        aliases: [ jellyfin ]
    profiles: [ jellyfin ]
    image: tailscale/tailscale:latest
    container_name: jellyfin-ts
    restart: unless-stopped
    hostname: jellyfin
    environment:
      - TS_HOSTNAME=jellyfin
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json     # 443 -> 127.0.0.1:8096 (+ /danmaku/ -> Misaka, docs/3-danmaku.md §5)
    volumes:
      - tailscale-jellyfin:/var/lib/tailscale
      - ./jellyfin-ts:/config
  jellyfin:
    profiles: [ jellyfin ]
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    network_mode: "service:jellyfin-ts"
    environment: [ PUID=1000, PGID=1000, TZ=UTC ]
    volumes:
      - ./jellyfin-config:/config
      - ./jellyfin-cache:/cache
      - /mnt:/mnt:rslave                # REQUIRED for symlink resolution
      - ./jellyfin-init:/custom-cont-init.d:ro   # optional 弹幕 in Jellyfin web: put jellyfin/inject-danmaku.sh here (docs/3-danmaku.md §5); empty = nothing
    depends_on: [ rclone, jellyfin-ts ]

volumes:
  zurgdata:
  tailscale-alist:
  tailscale-jellyfin:

networks:
  playback:
    external: true
    name: media-playback
